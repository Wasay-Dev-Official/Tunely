<script>
let audio = document.getElementById("audio");
let nowPlaying = document.getElementById("nowPlaying");
let progress = document.getElementById("progress");
let volume = document.getElementById("volume");
let muteBtn = document.getElementById("muteBtn");
let playBtn = document.getElementById("playBtn");
let loopBtn = document.getElementById("loopBtn");
let timeDisplay = document.getElementById("time");

let songs = document.getElementsByClassName("song");

let playlist = [
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/After%20Hours.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/blinding%20lights.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/Call%20Out%20My%20Name.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/Cry%20For%20Me.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/Die%20For%20You.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/House%20Of%20Balloons.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/I%20Was%20Never%20There.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/often.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/One%20Of%20The%20Girls.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/Popular.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/save%20your%20tears.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/starboy.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/S%C3%A3o%20Paulo.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/the%20hills.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/The%20Weeknd/Timeless.mp3"
];

let names = [
"After Hours",
"Blinding Lights",
"Call Out My Name",
"Cry For Me",
"Die For You",
"House Of Balloons",
"I Was Never There",
"Often",
"One Of The Girls",
"Popular",
"Save Your Tears",
"Starboy",
"São Paulo",
"The Hills",
"Timeless"
];

let currentSong = -1;

function playSong(index) {
currentSong = index;
audio.src = playlist[index];
audio.play();
nowPlaying.innerText = names[index];
progress.disabled = false;
progress.value = 0;
updateProgressBar();
playBtn.disabled = false;

for (let i = 0; i < songs.length; i++) {
songs[i].classList.remove("active");
}
songs[index].classList.add("active");
}

function togglePlay() {
audio.paused ? audio.play() : audio.pause();
}

function updateProgressBar() {
let value = progress.value || 0;
progress.style.setProperty("--progress-value", `${value}%`);
}

function nextSong() {
currentSong = (currentSong + 1) % playlist.length;
playSong(currentSong);
}

function prevSong() {
currentSong = (currentSong - 1 + playlist.length) % playlist.length;
playSong(currentSong);
}

function toggleLoop() {
audio.loop = !audio.loop;
loopBtn.classList.toggle("active", audio.loop);
}

function toggleMute() {
audio.muted = !audio.muted;
muteBtn.innerText = audio.muted ? "🔇" : "🔊";
}

audio.ontimeupdate = function () {
if (audio.duration) {
progress.value = (audio.currentTime / audio.duration) * 100;
updateProgressBar();
timeDisplay.innerText =
Math.floor(audio.currentTime / 60) + ":" +
String(Math.floor(audio.currentTime % 60)).padStart(2, "0") +
" / " +
Math.floor(audio.duration / 60) + ":" +
String(Math.floor(audio.duration % 60)).padStart(2, "0");
}
};

volume.oninput = function () {
audio.volume = this.value;
volume.style.setProperty("--volume-value", `${Number(this.value) * 100}%`);
};

progress.oninput = function () {
audio.currentTime = (progress.value / 100) * audio.duration;
updateProgressBar();
};

audio.onplay = () => {
playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
playBtn.classList.add("playing");
};

audio.onpause = () => {
playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
playBtn.classList.remove("playing");
};

audio.onended = nextSong;
</script>
