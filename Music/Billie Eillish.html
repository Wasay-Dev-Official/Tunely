<div class="song" onclick="playSong(4)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/Ocean%20Eyes.jpg" class="song-icon">Ocean Eyes</div>
<div class="song" onclick="playSong(5)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/Chihiro.jpg" class="song-icon">CHIHIRO</div>

<div class="song" onclick="playSong(8)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/Lovely.jpg" class="song-icon">Lovely</div>

<div id="player">

Now Playing: <span id="nowPlaying">None</span>

<br/><br/>

<input type="range" id="progress" min="0" max="100" value="0" disabled>
<span id="time">0:00 / 0:00</span>

<br/><br/>

<!-- CONTROLS -->
<div class="button-group">
<button class="control-btn" onclick="prevSong()">
<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
</button>

<button id="playBtn" onclick="togglePlay()" disabled>
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>

<button class="control-btn" onclick="nextSong()">
<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
</button>

<button id="loopBtn" class="control-btn" onclick="toggleLoop()">
<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7v4H5V6a2 2 0 0 1 2-2h10V1zM7 23l-4-4 4-4v3h10v-4h2v4a2 2 0 0 1-2 2H7v3z"/></svg>
</button>
</div>

<div class="controls">
<button id="muteBtn" onclick="toggleMute()">🔊</button>
<input type="range" id="volume" min="0" max="1" step="0.01" value="1">
</div>

</div>

<audio id="audio"></audio>
</div>
<div class="page-transition"></div>
<script src="songCatalog.js"></script>
<script src="script.js"></script>
<script>
let audio = document.getElementById("audio");
let nowPlaying = document.getElementById("nowPlaying");
let progress = document.getElementById("progress");
let volume = document.getElementById("volume");
let muteBtn = document.getElementById("muteBtn");
let playBtn = document.getElementById("playBtn");
let loopBtn = document.getElementById("loopBtn");
let timeDisplay = document.getElementById("time");

let songs = document.getElementsByClassName("song");

let playlist = [
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/bad%20guy.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/BIRDS%20OF%20A%20FEATHER.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/when%20the%20party_s%20over.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/Happier%20Than%20Ever.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/ocean%20eyes.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/chihiro.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/everything%20i%20wanted.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/wildflower.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/lovely.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Billie%20Eillish/What%20Was%20I%20Made%20For.mp3"
];


let names = [
  "bad guy",
  "BIRDS OF A FEATHER",
  "When The Party's Over",
  "Happier Than Ever",
  "Ocean Eyes",
  "CHIHIRO",
  "Everything I Wanted",
  "WILDFLOWER",
  "lovely",
  "What Was I Made For"
    
];

let currentSong = -1;

function updateBar(el) {
  let min = Number(el.min) || 0;
  let max = Number(el.max) || 100;
  let value = ((Number(el.value) - min) / (max - min)) * 100;
  value = Math.max(0, Math.min(100, value));

  if (el.id === "progress") {
    el.style.setProperty("--progress-value", `${value}%`);
  } else {
    el.style.setProperty("--volume-value", `${value}%`);
  }
}

function playSong(index) {
  currentSong = index;
  audio.src = playlist[index];
  audio.play();

  nowPlaying.innerText = names[index];

  progress.disabled = false;
  progress.value = 0;
  updateBar(progress);
  playBtn.disabled = false;

  for (let i = 0; i < songs.length; i++) {
    songs[i].classList.remove("active");
  }
  songs[index].classList.add("active");
}

function togglePlay() {
  audio.paused ? audio.play() : audio.pause();
}

function nextSong() {
  currentSong = (currentSong + 1) % playlist.length;
  playSong(currentSong);
}

function prevSong() {
  currentSong = (currentSong - 1 + playlist.length) % playlist.length;
  playSong(currentSong);
}

function toggleLoop() {
  audio.loop = !audio.loop;
  loopBtn.classList.toggle("active", audio.loop);
}

function toggleMute() {
  audio.muted = !audio.muted;
  muteBtn.innerText = audio.muted ? "🔇" : "🔊";
}

audio.ontimeupdate = function () {
  if (audio.duration) {
    progress.value = (audio.currentTime / audio.duration) * 100;
    updateBar(progress);
    timeDisplay.innerText =
      Math.floor(audio.currentTime / 60) + ":" +
      String(Math.floor(audio.currentTime % 60)).padStart(2, "0") +
      " / " +
      Math.floor(audio.duration / 60) + ":" +
      String(Math.floor(audio.duration % 60)).padStart(2, "0");
  }
};

volume.oninput = function () {
  audio.volume = this.value;
  updateBar(this);
};

progress.oninput = function () {
  audio.currentTime = (progress.value / 100) * audio.duration;
  updateBar(this);
};

audio.onplay = () => {
  playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
  playBtn.classList.add("playing");
};

audio.onpause = () => {
  playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
  playBtn.classList.remove("playing");
};

audio.onended = nextSong;
</script>
</body>
</html>
