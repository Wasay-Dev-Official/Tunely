      <div class="song" onclick="playSong(1)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/beauty%20and%20a%20beat.jpg" class="song-icon" alt="">Beauty And A Beat</div>
      <div class="song" onclick="playSong(2)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/confident.jpg" class="song-icon" alt="">Confident</div>
      <div class="song" onclick="playSong(3)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/daisies.jpg" class="song-icon" alt="">DAISIES</div>
      <div class="song" onclick="playSong(4)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/eeinie%20meenie.jpg" class="song-icon" alt="">Eenie Meenie</div>
      <div class="song" onclick="playSong(5)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/ghost.jpg" class="song-icon" alt="">Ghost</div>
      <div class="song" onclick="playSong(6)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/hard%20to%20face%20reality.jpg" class="song-icon" alt="">Hard To Face Reality</div>
      <div class="song" onclick="playSong(7)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/love%20yourself.jpg" class="song-icon" alt="">Love Yourself</div>
      <div class="song" onclick="playSong(8)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/sorry.jpg" class="song-icon" alt="">Sorry</div>
      <div class="song" onclick="playSong(9)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/stay.jpg" class="song-icon" alt="">STAY</div>
      <div class="song" onclick="playSong(10)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/youkon.jpg" class="song-icon" alt="">YUKON</div>
    </main>

    <div id="player">
      Now Playing: <span id="nowPlaying">None</span>
      <br><br>
      <input type="range" id="progress" min="0" max="100" value="0" disabled>
      <span id="time">0:00 / 0:00</span>
      <br><br>
      <div class="button-group">
        <button class="control-btn" onclick="prevSong()" aria-label="Previous song">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
        </button>
        <button id="playBtn" onclick="togglePlay()" disabled aria-label="Play or pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" onclick="nextSong()" aria-label="Next song">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button id="loopBtn" class="control-btn" onclick="toggleLoop()" aria-label="Toggle repeat">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7v4H5V6a2 2 0 0 1 2-2h10V1zM7 23l-4-4 4-4v3h10v-4h2v4a2 2 0 0 1-2 2H7v3z"/></svg>
        </button>
      </div>
      <div class="controls">
        <button id="muteBtn" onclick="toggleMute()" aria-label="Mute or unmute">ðŸ”Š</button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </div>

    <audio id="audio"></audio>
    <div class="page-transition"></div>
  </div>

  <script src="songCatalog.js"></script>
  <script src="script.js?v=2"></script>
  <script>
    const audio = document.getElementById('audio');
    const nowPlaying = document.getElementById('nowPlaying');
    const progress = document.getElementById('progress');
    const volume = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');
    const playBtn = document.getElementById('playBtn');
    const loopBtn = document.getElementById('loopBtn');
    const timeDisplay = document.getElementById('time');
    const songs = Array.from(document.getElementsByClassName('song'));

    const names = [
      'Baby',
      'Beauty And A Beat',
      'Confident',
      'DAISIES',
      'Eenie Meenie',
      'Ghost',
      'Hard To Face Reality',
      'Love Yourself',
      'Sorry',
      'STAY',
      'YUKON'
    ];

    const playlist = [
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Baby.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Beauty%20And%20A%20Beat.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Confident.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/DAISIES.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Eenie%20Meenie.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Ghost.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/hard%20to%20face%20reality.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Love%20Yourself.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/Sorry.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/STAY.mp3',
      'https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Justin%20Bieber/YUKON.mp3'
    ];

    let currentSong = -1;

    function updateProgressBar() {
      const value = Number(progress.value) || 0;
      progress.style.setProperty('--progress-value', `${value}%`);
    }

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[index];
      nowPlaying.textContent = names[index];
      progress.disabled = false;
      progress.value = 0;
      updateProgressBar();
      playBtn.disabled = false;
      songs.forEach((song, songIndex) => song.classList.toggle('active', songIndex === index));

      audio.play().catch(() => {
        nowPlaying.textContent = `${names[index]}: audio file unavailable`;
      });
    }

    function togglePlay() {
      if (audio.paused && currentSong < 0) {
        playSong(0);
      } else if (audio.paused) {
        audio.play().catch(() => {
          nowPlaying.textContent = `${names[currentSong]}: audio file unavailable`;
        });
      } else {
        audio.pause();
      }
    }

    function nextSong() {
      playSong((currentSong + 1) % playlist.length);
    }

    function prevSong() {
      playSong((currentSong - 1 + playlist.length) % playlist.length);
    }

    function toggleLoop() {
      audio.loop = !audio.loop;
      loopBtn.classList.toggle('active', audio.loop);
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? 'ðŸ”‡' : 'ðŸ”Š';
    }

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;

      progress.value = (audio.currentTime / audio.duration) * 100;
      updateProgressBar();

      const formatTime = (time) =>
        `${Math.floor(time / 60)}:${String(Math.floor(time % 60)).padStart(2, '0')}`;

      timeDisplay.textContent =
        `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    audio.addEventListener('error', () => {
      if (currentSong >= 0) {
        nowPlaying.textContent = `${names[currentSong]}: audio file unavailable`;
      }
    });

    audio.addEventListener('play', () => {
      playBtn.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      playBtn.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      playBtn.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      playBtn.classList.remove('playing');
    });

    audio.addEventListener('ended', nextSong);

    volume.addEventListener('input', () => {
      audio.volume = volume.value;
      volume.style.setProperty('--volume-value', `${Number(volume.value) * 100}%`);
    });

    progress.addEventListener('input', () => {
      if (!audio.duration) return;

      audio.currentTime = (progress.value / 100) * audio.duration;
      updateProgressBar();
    });
  </script>
</body>
</html>
