<script>
const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const muteBtn = document.getElementById("muteBtn");
const playBtn = document.getElementById("playBtn");
const loopBtn = document.getElementById("loopBtn");
const timeDisplay = document.getElementById("time");
const songs = document.getElementsByClassName("song");

const playlist = [
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Angreji%20Beat.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Blue%20Eyes.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/BROWN%20RANG.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Chaar%20Botal%20Vodka.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Desi%20Kalakaar.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Dheere%20Dheere%20Se.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/DIL%20CHORI.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/LOVE%20DOSE.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/Lungi%20Dance.mp3",
"https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Yo%20Yo%20Honey%20Singh/MILLIONAIRE.mp3"
];

const names = [
"Angreji Beat",
"Blue Eyes",
"Brown Rang",
"Chaar Botal Vodka",
"Desi Kalakaar",
"Dheere Dheere Se",
"Dil Chori",
"Love Dose",
"Lungi Dance",
"Millionaire"
];

let currentSong = -1;

function playSong(index) {
currentSong = index;
audio.src = playlist[index];
audio.play();
nowPlaying.innerText = names[index];
progress.disabled = false;
progress.value = 0;
updateProgressBar();
playBtn.disabled = false;

for (let i = 0; i < songs.length; i++) {
songs[i].classList.remove("active");
}
songs[index].classList.add("active");
}

function togglePlay() {
audio.paused ? audio.play() : audio.pause();
}

function updateProgressBar() {
let value = progress.value || 0;
progress.style.setProperty("--progress-value", `${value}%`);
}

function nextSong() {
currentSong = (currentSong + 1) % playlist.length;
playSong(currentSong);
}

function prevSong() {
currentSong = (currentSong - 1 + playlist.length) % playlist.length;
playSong(currentSong);
}

function toggleLoop() {
audio.loop = !audio.loop;
loopBtn.classList.toggle("active", audio.loop);
}

function toggleMute() {
audio.muted = !audio.muted;
muteBtn.innerText = audio.muted ? "🔇" : "🔊";
}

audio.ontimeupdate = function () {
if (audio.duration) {
progress.value = (audio.currentTime / audio.duration) * 100;
updateProgressBar();
timeDisplay.innerText =
Math.floor(audio.currentTime / 60) + ":" +
String(Math.floor(audio.currentTime % 60)).padStart(2, "0") +
" / " +
Math.floor(audio.duration / 60) + ":" +
String(Math.floor(audio.duration % 60)).padStart(2, "0");
}
};

volume.oninput = function () {
audio.volume = this.value;
volume.style.setProperty("--volume-value", `${Number(this.value) * 100}%`);
};

progress.oninput = function () {
audio.currentTime = (progress.value / 100) * audio.duration;
updateProgressBar();
};

audio.onplay = () => {
playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
playBtn.classList.add("playing");
};

audio.onpause = () => {
playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
playBtn.classList.remove("playing");
};

audio.onended = nextSong;
</script>
