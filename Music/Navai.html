<!DOCTYPE html>
<html lang="en">
<head>
  <title>Navai</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Style.css">
</head>
<body>
  <div class="page-shell">
    <div id="menu">
      <a id="logo" href="index.html"><h2>Tunely</h2></a>
      <div class="search-wrapper">
        <input type="text" id="search" placeholder="Search songs...">
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>

    <div id="conteudo">
      <div id="album-header">
        <img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Images/Navai.jpg" alt="Navai">
        <div>
          <h1>Navai</h1>
          <p>Artist • Playlist</p>
        </div>
      </div>

      <br>

      <div class="song" onclick="playSong(0)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%BD%D0%B5%20%D0%BF%D1%80%D0%B8%D0%BC%D1%83%20%D0%B8%20%D0%B4%D0%B0%D1%80%D0%BE%D0%BC.jpg" class="song-icon" alt="">Не приму и даром</div>
      <div class="song" onclick="playSong(1)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%91%D0%B5%D0%B7%D1%83%D1%81%D0%BB%D0%BE%D0%B2%D0%BD%D0%B0%D1%8F%20%D0%BB%D1%8E%D0%B1%D0%BE%D0%B2%D1%8C.jpg" class="song-icon" alt="">Безусловная любовь</div>
      <div class="song" onclick="playSong(2)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/1.jpg" class="song-icon" alt="">Больше, чем ближе</div>
      <div class="song" onclick="playSong(3)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/2.png" class="song-icon" alt="">Дай знать</div>
      <div class="song" onclick="playSong(4)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%95%D1%81%D0%B5%D0%BD%D0%B8%D0%BD.jpg" class="song-icon" alt="">Есенин</div>
      <div class="song" onclick="playSong(5)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/1.jpg" class="song-icon" alt="">Зачем ты врёшь</div>
      <div class="song" onclick="playSong(6)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%9D%D0%B5%D1%83%D0%B6%D0%B5%D0%BB%D0%B8%20%D1%8D%D1%82%D0%BE%20%D0%B2%D1%81%D0%B5%20%D0%BB%D1%8E%D0%B1%D0%BE%D0%B2%D1%8C.jpg" class="song-icon" alt="">Неужели это все любовь</div>
      <div class="song" onclick="playSong(7)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/2.png" class="song-icon" alt="">Сгореть</div>
      <div class="song" onclick="playSong(8)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/1.jpg" class="song-icon" alt="">Чёрный мерен</div>
      <div class="song" onclick="playSong(9)"><img src="https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%AD%D0%B3%D0%BE%D0%B8%D1%81%D1%82.jpg" class="song-icon" alt="">Эгоист</div>
    </div>

    <div id="player">
      Now Playing: <span id="nowPlaying">None</span>
      <br><br>
      <input type="range" id="progress" min="0" max="100" value="0" disabled>
      <span id="time">0:00 / 0:00</span>
      <br><br>
      <div class="button-group">
        <button class="control-btn" onclick="prevSong()">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
        </button>
        <button id="playBtn" onclick="togglePlay()" disabled>
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" onclick="nextSong()">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button id="loopBtn" class="control-btn" onclick="toggleLoop()">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7v4H5V6a2 2 0 0 1 2-2h10V1zM7 23l-4-4 4-4v3h10v-4h2v4a2 2 0 0 1-2 2H7v3z"/></svg>
        </button>
      </div>
      <div class="controls">
        <button id="muteBtn" onclick="toggleMute()">🔊</button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <audio id="audio"></audio>
  </div>
  <div class="page-transition"></div>

  <script src="songCatalog.js"></script>
  <script src="script.js?v=2"></script>
  <script>
    const audio = document.getElementById("audio");
    const nowPlaying = document.getElementById("nowPlaying");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const muteBtn = document.getElementById("muteBtn");
    const playBtn = document.getElementById("playBtn");
    const loopBtn = document.getElementById("loopBtn");
    const timeDisplay = document.getElementById("time");
    const songs = document.getElementsByClassName("song");

    const playlist = [
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/Navai%20%2C%20Bahh%20Tee%20-%20%D0%9D%D0%B5%20%D0%BF%D1%80%D0%B8%D0%BC%D1%83%20%D0%B8%20%D0%B4%D0%B0%D1%80%D0%BE%D0%BC%20-%20HammAli%20%26%20Navai.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%91%D0%B5%D0%B7%D1%83%D1%81%D0%BB%D0%BE%D0%B2%D0%BD%D0%B0%D1%8F%20%D0%BB%D1%8E%D0%B1%D0%BE%D0%B2%D1%8C.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%91%D0%BE%D0%BB%D1%8C%D1%88%D0%B5%2C%20%D1%87%D0%B5%D0%BC%20%D0%B1%D0%BB%D0%B8%D0%B6%D0%B5.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%94%D0%B0%D0%B9%20%D0%B7%D0%BD%D0%B0%D1%82%D1%8C.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%95%D1%81%D0%B5%D0%BD%D0%B8%D0%BD.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%97%D0%B0%D1%87%D0%B5%D0%BC%20%D1%82%D1%8B%20%D0%B2%D1%80%D1%91%D1%88i.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%9D%D0%B5%D1%83%D0%B6%D0%B5%D0%BB%D0%B8%20%D1%8D%D1%82%D0%BE%20%D0%B2%D1%81%D0%B5%20%D0%BB%D1%8E%D0%B1%D0%BE%D0%B2%D1%8C.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%A1%D0%B3%D0%BE%D1%80%D0%B5%D1%82%D1%8C.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%A7%D1%91%D1%80%D0%BD%D1%8B%D0%B9%20%D0%BC%D0%B5%D1%80%D0%B5%D0%BD.mp3",
      "https://pub-5535fdd2753a45898c540f95dd6c9f64.r2.dev/Audios/Navai/%D0%AD%D0%B3%D0%BE%D0%B8%D1%81%D1%82.mp3"
    ];

    const names = [
      "Не приму и даром",
      "Безусловная любовь",
      "Больше, чем ближе",
      "Дай знать",
      "Есенин",
      "Зачем ты врёшь",
      "Неужели это все любовь",
      "Сгореть",
      "Чёрный мерен",
      "Эгоист"
    ];

    let currentSong = -1;

    function updateProgressBar() {
      progress.style.setProperty("--progress-value", `${progress.value || 0}%`);
    }

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[index];
      audio.play();
      nowPlaying.innerText = names[index];
      progress.disabled = false;
      progress.value = 0;
      updateProgressBar();
      playBtn.disabled = false;

      for (let i = 0; i < songs.length; i++) {
        songs[i].classList.remove("active");
      }
      songs[index].classList.add("active");
    }

    function togglePlay() {
      audio.paused ? audio.play() : audio.pause();
    }

    function nextSong() {
      playSong((currentSong + 1) % playlist.length);
    }

    function prevSong() {
      playSong((currentSong - 1 + playlist.length) % playlist.length);
    }

    function toggleLoop() {
      audio.loop = !audio.loop;
      loopBtn.classList.toggle("active", audio.loop);
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      muteBtn.innerText = audio.muted ? "🔇" : "🔊";
    }

    audio.ontimeupdate = function () {
      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
        updateProgressBar();
        timeDisplay.innerText =
          Math.floor(audio.currentTime / 60) + ":" +
          String(Math.floor(audio.currentTime % 60)).padStart(2, "0") +
          " / " +
          Math.floor(audio.duration / 60) + ":" +
          String(Math.floor(audio.duration % 60)).padStart(2, "0");
      }
    };

    volume.oninput = function () {
      audio.volume = this.value;
      volume.style.setProperty("--volume-value", `${Number(this.value) * 100}%`);
    };

    progress.oninput = function () {
      audio.currentTime = (progress.value / 100) * audio.duration;
      updateProgressBar();
    };

    audio.onplay = () => {
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
      playBtn.classList.add("playing");
    };

    audio.onpause = () => {
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      playBtn.classList.remove("playing");
    };

    audio.onended = nextSong;
  </script>
</body>
</html>
